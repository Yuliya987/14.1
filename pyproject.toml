[tool.poetry]
name = "14-1"
version = "0.1.0"
description = ""
authors = ["Admin <stanislavovnajuli987@gmail.com>"]
readme = "README.md"
packages = [{include = "14"}]

[tool.poetry.dependencies]
python = "^3.14"
pytest = "^9.2.0"
pytest-cov = ">=7.1.0"
poetry-core = "^2.5.0"
mypy = ">=2.3.1"
black = ">=26.5.1"
flake8 = ">=7.3.0"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<9.0.2)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.coverage.run]
